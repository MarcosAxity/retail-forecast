[project]
name = "retail-forecast"
version = "0.1.0"
description = "Forecast de ventas por tienda y categoría y medición de uplift promocional (retail México)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "shap>=0.45",
    "statsmodels>=0.14",
    "scipy>=1.12",
    "plotly>=5.20",
    "streamlit>=1.35",
    "joblib>=1.3",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["jupyter>=1.0", "nbconvert>=7", "matplotlib>=3.8", "pytest>=8", "ruff>=0.4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
